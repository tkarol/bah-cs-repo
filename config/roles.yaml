# Role assignments. Kept in the repo like everything else, so a permission
# change is a reviewable commit rather than a console click nobody can audit.
#
# Managed from the Admin page in the app. Hand edits are fine too.
#
# Roles (docs/ARCHITECTURE.md §8):
#   csm         read all; write only accounts they own
#   presales    read all; write presales-stage accounts and commitments they originate
#   leadership  read all; waive gate items; reassign ownership
#   admin       everything, plus managing this file
#
# Anyone Access lets in who is not listed here gets default_role.
default_role: csm

users:
  - email: karol_tyler@bah.com
    role: admin
