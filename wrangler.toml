# One Worker serves both the API and the built SPA.
#
# This lives at the repository root, not in packages/worker, so Cloudflare's Git
# integration (Workers Builds) finds it with no configuration: the default
# `npx wrangler deploy` just works. Paths below resolve relative to this file.
#
# `run_worker_first` sends /api/* to the script; everything else is served
# straight from the static assets, falling back to index.html for client-side
# routes. That removes the whole class of Pages-plus-Worker routing problems:
# one origin, one deploy, no CORS, and Access protects both halves at once.
# Must match the Worker created in the Cloudflare dashboard. The name here
# wins on deploy, so a mismatch silently creates a second, empty Worker.
name = "bah-cs-repo"
main = "packages/worker/src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "packages/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# No D1, KV, R2 or Queue bindings: the repository is the backend, and the index
# is a file. See docs/ARCHITECTURE.md §3.

[vars]
GITHUB_REPO = "tkarol/bah-cs-repo"
GITHUB_BRANCH = "main"

# Identifiers for the GitHub App that commits customer files. Neither is
# sensitive -- they name an app and an installation, and are useless without the
# private key -- so they live here rather than in the secrets UI. That leaves
# exactly one secret to configure.
GITHUB_APP_ID = "4978398"
GITHUB_INSTALLATION_ID = "162491853"
# The Cloudflare Access application audience tag and team domain. Not secrets,
# but they must match the Access app exactly or every request is rejected.
ACCESS_AUD = "487714998247bfebab71df1e264779e60d8f16a6e67693d575e7cbfb501e301e"
ACCESS_TEAM_DOMAIN = "round-frost-38a4.cloudflareaccess.com"

# The only secret. Paste the .pem exactly as GitHub downloads it -- the Worker
# accepts PKCS#1 ("BEGIN RSA PRIVATE KEY") and converts it internally, and
# ignores whitespace, so no openssl step and no newline fiddling.
#   GITHUB_PRIVATE_KEY
