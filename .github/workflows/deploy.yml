# Manual deploy — a fallback, not the normal path.
#
# Cloudflare's Git integration (Workers Builds) is connected to this repository
# and deploys on push to the production branch. If this workflow also deployed
# on push, two deployers would race the same Worker for every commit, and this
# one would need a CLOUDFLARE_API_TOKEN that the Git integration makes
# unnecessary.
#
# So it is dispatch-only: use it if the Git integration is broken or
# disconnected. It needs the CLOUDFLARE_API_TOKEN secret only when run.
name: Deploy (manual)

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Never ship a Worker that fails its own checks.
      - run: npm run typecheck
      - run: npm test

      - name: Build the app
        run: npm run build

      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
